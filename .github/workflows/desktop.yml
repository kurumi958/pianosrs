name: Desktop app

# Builds the desktop app for Windows, macOS and Linux. A tag like v0.2.0, a manual run, or a push whose commit message
# contains [release] also publishes the builds as a GitHub pre-release named after package.json's version.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['electron/**', 'build/**', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        if: matrix.os == 'ubuntu-latest'
        run: npm test
      - run: npm run build
      - name: Package
        run: npx electron-builder --publish never
        env:
          # Not code-signed yet: Windows and macOS will warn on first launch.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: pianosrs-${{ runner.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PianoSRS ${{ steps.version.outputs.version }} (prototype)
          prerelease: true
          files: artifacts/*
          body_path: .github/release-notes.md
